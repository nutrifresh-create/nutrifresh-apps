name: Build NutriFresh Desktop (.exe POS & Office)

on:
  push:
    branches: [ main ]
    paths:
      - 'web/pos.html'
      - 'web/office.html'
      - 'web/sw.js'
      - 'web/native-bridge.js'
      - 'web/supabase-adapter.js'
      - 'web/nutri-theme.css'
      - 'scripts/configure_desktop_updater.py'
      - 'scripts/prepare_web_bundles.py'
      - 'desktop/**'
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Catatan pembaruan (tampil di pop-up update PC Windows)'
        required: false
        default: 'v153.3 - UI Retail Pro 2 Tema (Natural & Dark), Bersih Splash & Header POS/Staff/Office, Auto-Update APK & EXE.'
      force_update:
        description: 'Wajibkan update (user tidak bisa melewati pop-up)?'
        type: boolean
        required: false
        default: false

concurrency:
  group: desktop-exe-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-pos-exe:
    name: Build NutriFresh POS (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/pos-tauri/src-tauri

      - name: Prepare web bundle for POS
        run: python scripts/prepare_web_bundles.py

      - name: Configure Desktop Auto-Updater & Release Manifest (POS)
        shell: pwsh
        env:
          INPUT_NOTES: ${{ github.event.inputs.release_notes }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          FORCE_UPDATE: ${{ github.event.inputs.force_update || 'false' }}
        run: |
          $notes = $env:INPUT_NOTES
          if ([string]::IsNullOrWhiteSpace($notes)) {
            $c = ($env:COMMIT_MSG -split "`n")[0]
            $notes = if ([string]::IsNullOrWhiteSpace($c)) { "v153.3 - UI Retail Pro 2 Tema (Natural & Dark), Bersih Splash & Header POS/Staff/Office, Auto-Update APK & EXE." } else { $c.Trim() }
          }
          $env:RELEASE_NOTES = $notes
          python scripts/configure_desktop_updater.py desktop/pos-tauri pos NutriFresh_POS.exe update-desktop-pos.json

      - name: Install Tauri CLI v2
        run: npm install -g @tauri-apps/cli@2

      - name: Build NutriFresh POS (.exe)
        working-directory: desktop/pos-tauri
        run: tauri build --no-bundle

      - name: Package NutriFresh_POS.exe
        shell: pwsh
        run: |
          Copy-Item "desktop/pos-tauri/src-tauri/target/release/nutrifresh_pos.exe" "NutriFresh_POS.exe" -Force

      - name: Publish NutriFresh_POS.exe & Update Manifest to GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view latest-desktop *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create latest-desktop --title "NutriFresh Desktop Windows (.exe Auto-Update)" --notes "Rilis otomatis NutriFresh_POS.exe & NutriFresh_Office.exe untuk In-App Auto-Updater Windows."
          }

          $uploaded = $false
          for ($i = 1; $i -le 5; $i++) {
            gh release upload latest-desktop "NutriFresh_POS.exe" "update-desktop-pos.json" --clobber
            if ($LASTEXITCODE -eq 0) {
              Write-Host "[release] Uploaded NutriFresh_POS.exe & update-desktop-pos.json to latest-desktop!"
              $uploaded = $true
              break
            }
            Write-Host "[release] Retry upload ($i/5)..."
            Start-Sleep -Seconds ($i * 5)
          }
          if (-not $uploaded) { exit 1 }

      - name: Upload NutriFresh_POS.exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NutriFresh_POS_Windows_EXE
          path: NutriFresh_POS.exe
          retention-days: 30

  build-office-exe:
    name: Build NutriFresh Office (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/office-tauri/src-tauri

      - name: Prepare web bundle for Office
        run: python scripts/prepare_web_bundles.py

      - name: Configure Desktop Auto-Updater & Release Manifest (Office)
        shell: pwsh
        env:
          INPUT_NOTES: ${{ github.event.inputs.release_notes }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          FORCE_UPDATE: ${{ github.event.inputs.force_update || 'false' }}
        run: |
          $notes = $env:INPUT_NOTES
          if ([string]::IsNullOrWhiteSpace($notes)) {
            $c = ($env:COMMIT_MSG -split "`n")[0]
            $notes = if ([string]::IsNullOrWhiteSpace($c)) { "v153.3 - UI Retail Pro 2 Tema (Natural & Dark), Bersih Splash & Header POS/Staff/Office, Auto-Update APK & EXE." } else { $c.Trim() }
          }
          $env:RELEASE_NOTES = $notes
          python scripts/configure_desktop_updater.py desktop/office-tauri office NutriFresh_Office.exe update-desktop-office.json

      - name: Install Tauri CLI v2
        run: npm install -g @tauri-apps/cli@2

      - name: Build NutriFresh Office (.exe)
        working-directory: desktop/office-tauri
        run: tauri build --no-bundle

      - name: Package NutriFresh_Office.exe
        shell: pwsh
        run: |
          Copy-Item "desktop/office-tauri/src-tauri/target/release/nutrifresh_office.exe" "NutriFresh_Office.exe" -Force

      - name: Publish NutriFresh_Office.exe & Update Manifest to GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Start-Sleep -Seconds 6
          gh release view latest-desktop *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create latest-desktop --title "NutriFresh Desktop Windows (.exe Auto-Update)" --notes "Rilis otomatis NutriFresh_POS.exe & NutriFresh_Office.exe untuk In-App Auto-Updater Windows."
          }

          $uploaded = $false
          for ($i = 1; $i -le 5; $i++) {
            gh release upload latest-desktop "NutriFresh_Office.exe" "update-desktop-office.json" --clobber
            if ($LASTEXITCODE -eq 0) {
              Write-Host "[release] Uploaded NutriFresh_Office.exe & update-desktop-office.json to latest-desktop!"
              $uploaded = $true
              break
            }
            Write-Host "[release] Retry upload ($i/5)..."
            Start-Sleep -Seconds ($i * 5)
          }
          if (-not $uploaded) { exit 1 }

      - name: Upload NutriFresh_Office.exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NutriFresh_Office_Windows_EXE
          path: NutriFresh_Office.exe
          retention-days: 30

name: Build NutriFresh Office Android (.apk)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-office-apk:
    name: Build NutriFresh Office (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare web bundle for Office Android
        run: python3 scripts/prepare_web_bundles.py

      - name: Install Capacitor dependencies
        working-directory: mobile/office-android
        run: npm install

      - name: Generate Android native project
        working-directory: mobile/office-android
        run: npx cap add android && npx cap sync android

      - name: Configure icons, OAuth Deep Link, Notifications & Smart Back
        run: python3 mobile/office-android/scripts/configure_android.py

      - name: Build Release-ready APK (debug-signed for direct sideload install)
        working-directory: mobile/office-android/android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Rename APK
        run: cp mobile/office-android/android/app/build/outputs/apk/debug/app-debug.apk NutriFresh_Office.apk

      - name: Upload NutriFresh_Office.apk
        uses: actions/upload-artifact@v4
        with:
          name: NutriFresh_Office_APK
          path: NutriFresh_Office.apk
          retention-days: 30

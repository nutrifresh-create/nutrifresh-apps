name: Build NutriFresh Customer (.apk)

on:
  workflow_dispatch:

jobs:
  build-customer-apk:
    name: Build NutriFresh Customer (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare web bundles
        run: python3 scripts/prepare_web_bundles.py

      - name: Install Capacitor dependencies
        working-directory: mobile/customer-android
        run: npm install

      - name: Generate Android native project
        working-directory: mobile/customer-android
        run: npx cap add android && npx cap sync android

      - name: Configure app icons, permissions & native bridge
        run: python3 mobile/customer-android/scripts/configure_android.py

      - name: Configure Permanent Release Signing, VersionCode & Firebase FCM
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: python3 scripts/configure_android_release_and_fcm.py mobile/customer-android id.my.nutrifresh.app nutrifresh_alerts

      - name: Build APK (Signed Release if Keystore Secret set, else Debug)
        working-directory: mobile/customer-android/android
        run: |
          chmod +x gradlew
          if [ -f .nf_release_signed ]; then
            echo "Building PERMANENTLY SIGNED Release APK..."
            ./gradlew assembleRelease
          else
            echo "Building Debug APK (add ANDROID_KEYSTORE_BASE64 secret for in-place updates)..."
            ./gradlew assembleDebug
          fi

      - name: Collect APK artifact
        run: |
          if [ -f mobile/customer-android/android/app/build/outputs/apk/release/app-release.apk ]; then
            cp mobile/customer-android/android/app/build/outputs/apk/release/app-release.apk NutriFresh.apk
          else
            cp mobile/customer-android/android/app/build/outputs/apk/debug/app-debug.apk NutriFresh.apk
          fi

      - name: Upload NutriFresh.apk
        uses: actions/upload-artifact@v4
        with:
          name: NutriFresh_Customer_APK
          path: NutriFresh.apk
          retention-days: 30

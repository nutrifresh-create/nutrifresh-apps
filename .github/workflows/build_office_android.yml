name: Build NutriFresh Office Android (.apk)

on:
  push:
    branches: [ main ]
    paths:
      - 'web/office.html'
      - 'web/sw.js'
      - 'web/native-bridge.js'
      - 'web/supabase-adapter.js'
      - 'web/nutri-theme.css'
      - 'scripts/configure_android_release_and_fcm.py'
      - 'scripts/prepare_web_bundles.py'
      - 'mobile/office-android/**'
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Catatan pembaruan (tampil di pop-up update HP)'
        required: false
        default: 'v153.3 - UI Retail Pro 2 Tema (Natural & Dark), Bersih Splash & Header POS/Staff/Office, Auto-Update APK & EXE.'
      force_update:
        description: 'Wajibkan update (user tidak bisa melewati pop-up)?'
        type: boolean
        required: false
        default: false

concurrency:
  group: android-office-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-office-apk:
    name: Build NutriFresh Office Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare web bundles
        run: python3 scripts/prepare_web_bundles.py

      - name: Install Capacitor dependencies
        working-directory: mobile/office-android
        run: npm install

      - name: Generate Android native project
        working-directory: mobile/office-android
        run: npx cap add android && npx cap sync android

      - name: Configure app icons, permissions & native bridge
        run: python3 mobile/office-android/scripts/configure_android.py

      - name: Configure Release Signing, Smart Permissions, In-App Updater & FCM
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: python3 scripts/configure_android_release_and_fcm.py mobile/office-android id.my.nutrifresh.office nutrifresh_office_alerts office

      - name: Build APK (Signed Release if Keystore Secret set, else Debug)
        working-directory: mobile/office-android/android
        run: |
          chmod +x gradlew
          if [ -f .nf_release_signed ]; then
            echo "Building PERMANENTLY SIGNED Release APK..."
            ./gradlew assembleRelease
          else
            echo "Building Debug APK (add ANDROID_KEYSTORE_BASE64 secret for in-place updates)..."
            ./gradlew assembleDebug
          fi

      - name: Collect APK artifact
        run: |
          if [ -f mobile/office-android/android/app/build/outputs/apk/release/app-release.apk ]; then
            cp mobile/office-android/android/app/build/outputs/apk/release/app-release.apk NutriFresh_Office.apk
          else
            cp mobile/office-android/android/app/build/outputs/apk/debug/app-debug.apk NutriFresh_Office.apk
          fi

      - name: Publish Signed APK & Update Manifest to GitHub Releases (In-App Auto-Update)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_NOTES: ${{ github.event.inputs.release_notes }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          FORCE_UPDATE: ${{ github.event.inputs.force_update || 'false' }}
        run: |
          if [ ! -f mobile/office-android/android/.nf_release_signed ]; then
            echo "[release] Skipping GitHub Release publish because APK is unsigned Debug."
            exit 0
          fi

          python3 - << 'PYEOF'
          import json, os, datetime
          from pathlib import Path
          meta = json.loads(Path("mobile/office-android/android/.nf_version.json").read_text(encoding="utf-8"))
          repo = os.environ["GITHUB_REPOSITORY"]
          inp_notes = (os.environ.get("INPUT_NOTES") or "").strip()
          commit_first = (os.environ.get("COMMIT_MSG") or "").strip().splitlines()[0] if (os.environ.get("COMMIT_MSG") or "").strip() else ""
          notes = inp_notes or commit_first or "v153.3 - UI Retail Pro 2 Tema (Natural & Dark), Bersih Splash & Header POS/Staff/Office, Auto-Update APK & EXE."
          out = {
              "appRole": "office",
              "packageId": "id.my.nutrifresh.office",
              "versionCode": int(meta["versionCode"]),
              "versionName": str(meta["versionName"]),
              "apkFileName": "NutriFresh_Office.apk",
              "apkUrl": f"https://github.com/{repo}/releases/download/latest-apks/NutriFresh_Office.apk",
              "notes": notes,
              "force": str(os.environ.get("FORCE_UPDATE", "false")).lower() == "true",
              "publishedAt": datetime.datetime.now(datetime.timezone.utc).isoformat()
          }
          Path("update-office.json").write_text(json.dumps(out, indent=2, ensure_ascii=False), encoding="utf-8")
          print("[release] Generated update-office.json:", out)
          PYEOF

          sleep 9
          gh release view latest-apks >/dev/null 2>&1 || gh release create latest-apks --title "NutriFresh Android APKs (Auto-Update)" --notes "Rilis otomatis 4 APK NutriFresh bertanda tangan permanen untuk In-App Self-Updater." || true

          uploaded=0
          for i in 1 2 3 4 5; do
            if gh release upload latest-apks "NutriFresh_Office.apk" "update-office.json" --clobber; then
              echo "[release] Uploaded NutriFresh_Office.apk & update-office.json to latest-apks!"
              uploaded=1
              break
            fi
            echo "[release] Retry upload ($i/5)..."
            sleep $((i * 4))
          done
          if [ "$uploaded" -ne 1 ]; then exit 1; fi

      - name: Upload NutriFresh_Office.apk
        uses: actions/upload-artifact@v4
        with:
          name: NutriFresh_Office_APK
          path: NutriFresh_Office.apk
          retention-days: 30

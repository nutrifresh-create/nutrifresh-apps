name: Build NutriFresh POS (.exe & .apk)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows PC (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate native Windows runner
        working-directory: apps/nutrifresh_pos
        run: flutter create --org id.my.nutrifresh --project-name nutrifresh_pos --platforms=windows .

      - name: Configure Windows icon & metadata
        run: python scripts/configure_pos_platforms.py

      - name: Install dependencies
        working-directory: apps/nutrifresh_pos
        run: flutter pub get

      - name: Build Windows Release (.exe)
        working-directory: apps/nutrifresh_pos
        run: flutter build windows --release

      - name: Package NutriFresh_POS_Windows.zip
        shell: pwsh
        run: |
          $outDir = "apps/nutrifresh_pos/build/windows/x64/runner/Release"
          if (-not (Test-Path $outDir)) {
            $outDir = "apps/nutrifresh_pos/build/windows/runner/Release"
          }
          Compress-Archive -Path "$outDir/*" -DestinationPath "NutriFresh_POS_Windows.zip" -Force

      - name: Upload Windows .exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NutriFresh_POS_Windows_EXE
          path: NutriFresh_POS_Windows.zip
          retention-days: 30

  build-android:
    name: Build Android Tablet (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate native Android project
        working-directory: apps/nutrifresh_pos
        run: flutter create --org id.my.nutrifresh --project-name nutrifresh_pos --platforms=android .

      - name: Configure Android icons, OAuth deep link & Bluetooth bridge
        run: python3 scripts/configure_pos_platforms.py

      - name: Install dependencies
        working-directory: apps/nutrifresh_pos
        run: flutter pub get

      - name: Build Android Release (.apk)
        working-directory: apps/nutrifresh_pos
        run: flutter build apk --release

      - name: Rename APK
        run: cp apps/nutrifresh_pos/build/app/outputs/flutter-apk/app-release.apk NutriFresh_POS_Tablet.apk

      - name: Upload Android .apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NutriFresh_POS_Tablet_APK
          path: NutriFresh_POS_Tablet.apk
          retention-days: 30

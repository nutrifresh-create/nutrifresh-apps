name: nutrifresh_pos
description: NutriFresh POS Pro — Aplikasi Native Kasir, Kamera Scanner, Antrean Order, PO Parsel, Stok & Produksi Dapur untuk PC Windows (.exe) dan Tablet Android (.apk).
publish_to: none
version: 1.1.0+2

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  nf_core:
    path: ../../packages/nf_core
  supabase_flutter: ^2.8.0
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1
  printing: ^5.13.4
  pdf: ^3.11.1
  path_provider: ^2.1.4
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  mobile_scanner: ^6.0.2
  intl: ">=0.19.0 <0.22.0"

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/icon.png
    - assets/images/iconP.png

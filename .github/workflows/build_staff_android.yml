name: Build NutriFresh Staff (.apk)

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Catatan pembaruan (tampil di pop-up update HP)'
        required: false
        default: 'v152.2 - Pisah Riwayat Online/Offline, Tanda VOID, Kunci Rakit PO Parsel & Kurir COD, Pesan Ulang PO Parsel.'
      force_update:
        description: 'Wajibkan update (user tidak bisa melewati pop-up)?'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build-staff-apk:
    name: Build NutriFresh Staff (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare web bundles
        run: python3 scripts/prepare_web_bundles.py

      - name: Install Capacitor dependencies
        working-directory: mobile/staff-android
        run: npm install

      - name: Generate Android native project
        working-directory: mobile/staff-android
        run: npx cap add android && npx cap sync android

      - name: Configure app icons, permissions & native bridge
        run: python3 mobile/staff-android/scripts/configure_android.py

      - name: Configure Release Signing, Smart Permissions, In-App Updater & FCM
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: python3 scripts/configure_android_release_and_fcm.py mobile/staff-android id.my.nutrifresh.staff nutrifresh_staff_alerts staff

      - name: Build APK (Signed Release if Keystore Secret set, else Debug)
        working-directory: mobile/staff-android/android
        run: |
          chmod +x gradlew
          if [ -f .nf_release_signed ]; then
            echo "Building PERMANENTLY SIGNED Release APK..."
            ./gradlew assembleRelease
          else
            echo "Building Debug APK (add ANDROID_KEYSTORE_BASE64 secret for in-place updates)..."
            ./gradlew assembleDebug
          fi

      - name: Collect APK artifact
        run: |
          if [ -f mobile/staff-android/android/app/build/outputs/apk/release/app-release.apk ]; then
            cp mobile/staff-android/android/app/build/outputs/apk/release/app-release.apk NutriFresh_Staff.apk
          else
            cp mobile/staff-android/android/app/build/outputs/apk/debug/app-debug.apk NutriFresh_Staff.apk
          fi

      - name: Publish Signed APK & Update Manifest to GitHub Releases (In-App Auto-Update)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: "${{ github.event.inputs.release_notes || 'v152.2 - Pisah Riwayat Online/Offline, Tanda VOID, Kunci Rakit PO Parsel & Kurir COD, Pesan Ulang PO Parsel.' }}"
          FORCE_UPDATE: ${{ github.event.inputs.force_update || 'false' }}
        run: |
          if [ ! -f mobile/staff-android/android/.nf_release_signed ]; then
            echo "[release] Skipping GitHub Release publish because APK is unsigned Debug."
            exit 0
          fi

          python3 - << 'PYEOF'
          import json, os, datetime
          from pathlib import Path
          meta = json.loads(Path("mobile/staff-android/android/.nf_version.json").read_text(encoding="utf-8"))
          repo = os.environ["GITHUB_REPOSITORY"]
          out = {
              "appRole": "staff",
              "packageId": "id.my.nutrifresh.staff",
              "versionCode": int(meta["versionCode"]),
              "versionName": str(meta["versionName"]),
              "apkFileName": "NutriFresh_Staff.apk",
              "apkUrl": f"https://github.com/{repo}/releases/download/latest-apks/NutriFresh_Staff.apk",
              "notes": os.environ.get("RELEASE_NOTES", "").strip() or "Pembaruan fitur terbaru NutriFresh.",
              "force": str(os.environ.get("FORCE_UPDATE", "false")).lower() == "true",
              "publishedAt": datetime.datetime.now(datetime.timezone.utc).isoformat()
          }
          Path("update-staff.json").write_text(json.dumps(out, indent=2, ensure_ascii=False), encoding="utf-8")
          print("[release] Generated update-staff.json:", out)
          PYEOF

          gh release view latest-apks >/dev/null 2>&1 || gh release create latest-apks --title "NutriFresh Android APKs (Auto-Update)" --notes "Rilis otomatis 4 APK NutriFresh bertanda tangan permanen untuk In-App Self-Updater." || true

          for i in 1 2 3; do
            if gh release upload latest-apks "NutriFresh_Staff.apk" "update-staff.json" --clobber; then
              echo "[release] Uploaded NutriFresh_Staff.apk & update-staff.json to latest-apks!"
              break
            fi
            echo "[release] Retry upload ($i/3)..."
            sleep 4
          done

      - name: Upload NutriFresh_Staff.apk
        uses: actions/upload-artifact@v4
        with:
          name: NutriFresh_Staff_APK
          path: NutriFresh_Staff.apk
          retention-days: 30

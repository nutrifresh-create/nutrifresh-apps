name: Release All NutriFresh Apps (4 APK + 2 EXE)

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Catatan pembaruan (tampil di pop-up update HP & PC)'
        required: false
        default: 'v153.3 - UI Retail Pro 2 Tema (Natural & Dark), Bersih Splash & Header POS/Staff/Office, Auto-Update APK & EXE.'
      force_update:
        description: 'Wajibkan update (user tidak bisa melewati pop-up)?'
        type: boolean
        required: false
        default: false
      build_android:
        description: 'Bangun & rilis 4 APK Android (Customer, POS, Staff, Office)?'
        type: boolean
        required: false
        default: true
      build_desktop:
        description: 'Bangun & rilis 2 EXE Windows (POS & Office)?'
        type: boolean
        required: false
        default: true

concurrency:
  group: release-all-nutrifresh-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-android-matrix:
    if: ${{ github.event.inputs.build_android == 'true' }}
    name: Build APK (${{ matrix.role }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: customer
            subdir: mobile/customer-android
            pkg: id.my.nutrifresh.app
            channel: nutrifresh_alerts
            apk: NutriFresh.apk
          - role: pos
            subdir: mobile/pos-android
            pkg: id.my.nutrifresh.pos
            channel: nutrifresh_pos_alerts
            apk: NutriFresh_POS_Tablet.apk
          - role: staff
            subdir: mobile/staff-android
            pkg: id.my.nutrifresh.staff
            channel: nutrifresh_staff_alerts
            apk: NutriFresh_Staff.apk
          - role: office
            subdir: mobile/office-android
            pkg: id.my.nutrifresh.office
            channel: nutrifresh_office_alerts
            apk: NutriFresh_Office.apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python3 scripts/prepare_web_bundles.py
      - working-directory: ${{ matrix.subdir }}
        run: npm install
      - working-directory: ${{ matrix.subdir }}
        run: npx cap add android && npx cap sync android
      - run: python3 ${{ matrix.subdir }}/scripts/configure_android.py
      - env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: python3 scripts/configure_android_release_and_fcm.py ${{ matrix.subdir }} ${{ matrix.pkg }} ${{ matrix.channel }} ${{ matrix.role }}
      - working-directory: ${{ matrix.subdir }}/android
        run: |
          chmod +x gradlew
          if [ -f .nf_release_signed ]; then ./gradlew assembleRelease; else ./gradlew assembleDebug; fi
      - name: Stage APK & Manifest
        env:
          RELEASE_NOTES: ${{ github.event.inputs.release_notes || 'v153.3 - UI Retail Pro 2 Tema (Natural & Dark), Bersih Splash & Header POS/Staff/Office, Auto-Update APK & EXE.' }}
          FORCE_UPDATE: ${{ github.event.inputs.force_update || 'false' }}
        run: |
          mkdir -p dist_release
          if [ -f ${{ matrix.subdir }}/android/app/build/outputs/apk/release/app-release.apk ]; then
            cp ${{ matrix.subdir }}/android/app/build/outputs/apk/release/app-release.apk "dist_release/${{ matrix.apk }}"
          else
            cp ${{ matrix.subdir }}/android/app/build/outputs/apk/debug/app-debug.apk "dist_release/${{ matrix.apk }}"
          fi
          if [ -f ${{ matrix.subdir }}/android/.nf_release_signed ]; then
          python3 - << 'PYEOF'
          import json, os, datetime
          from pathlib import Path
          meta = json.loads(Path("${{ matrix.subdir }}/android/.nf_version.json").read_text(encoding="utf-8"))
          repo = os.environ["GITHUB_REPOSITORY"]
          out = {
              "appRole": "${{ matrix.role }}",
              "packageId": "${{ matrix.pkg }}",
              "versionCode": int(meta["versionCode"]),
              "versionName": str(meta["versionName"]),
              "apkFileName": "${{ matrix.apk }}",
              "apkUrl": f"https://github.com/{repo}/releases/download/latest-apks/${{ matrix.apk }}",
              "notes": (os.environ.get("RELEASE_NOTES") or "").strip() or "v153.3 - UI Retail Pro 2 Tema (Natural & Dark), Bersih Splash & Header POS/Staff/Office, Auto-Update APK & EXE.",
              "force": str(os.environ.get("FORCE_UPDATE", "false")).lower() == "true",
              "publishedAt": datetime.datetime.now(datetime.timezone.utc).isoformat()
          }
          Path("dist_release/update-${{ matrix.role }}.json").write_text(json.dumps(out, indent=2, ensure_ascii=False), encoding="utf-8")
          PYEOF
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-android-${{ matrix.role }}
          path: dist_release/
          retention-days: 14

  publish-android-release:
    needs: build-android-matrix
    if: ${{ always() && needs.build-android-matrix.result == 'success' }}
    name: Publish All 4 APKs to latest-apks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-android-*
          merge-multiple: true
          path: release_apks
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! ls release_apks/update-*.json >/dev/null 2>&1; then
            echo "[release] No signed release manifests found; skipping publish."
            exit 0
          fi
          gh release view latest-apks >/dev/null 2>&1 || gh release create latest-apks --title "NutriFresh Android APKs (Auto-Update)" --notes "Rilis otomatis 4 APK NutriFresh bertanda tangan permanen untuk In-App Self-Updater." || true
          for i in 1 2 3 4 5; do
            if gh release upload latest-apks release_apks/* --clobber; then
              echo "[release] All 4 APKs & manifests uploaded cleanly to latest-apks!"
              exit 0
            fi
            sleep $((i * 4))
          done
          exit 1

  build-desktop-matrix:
    if: ${{ github.event.inputs.build_desktop == 'true' }}
    name: Build EXE (${{ matrix.role }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: pos
            subdir: desktop/pos-tauri
            bin: nutrifresh_pos.exe
            exe: NutriFresh_POS.exe
            manifest: update-desktop-pos.json
          - role: office
            subdir: desktop/office-tauri
            bin: nutrifresh_office.exe
            exe: NutriFresh_Office.exe
            manifest: update-desktop-office.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.subdir }}/src-tauri
      - run: python scripts/prepare_web_bundles.py
      - env:
          RELEASE_NOTES: ${{ github.event.inputs.release_notes || 'v153.3 - UI Retail Pro 2 Tema (Natural & Dark), Bersih Splash & Header POS/Staff/Office, Auto-Update APK & EXE.' }}
          FORCE_UPDATE: ${{ github.event.inputs.force_update || 'false' }}
        run: python scripts/configure_desktop_updater.py ${{ matrix.subdir }} ${{ matrix.role }} ${{ matrix.exe }} ${{ matrix.manifest }}
      - run: npm install -g @tauri-apps/cli@2
      - working-directory: ${{ matrix.subdir }}
        run: tauri build --no-bundle
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist_desktop | Out-Null
          Copy-Item "${{ matrix.subdir }}/src-tauri/target/release/${{ matrix.bin }}" "dist_desktop/${{ matrix.exe }}" -Force
          Copy-Item "${{ matrix.manifest }}" "dist_desktop/${{ matrix.manifest }}" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: release-desktop-${{ matrix.role }}
          path: dist_desktop/
          retention-days: 14

  publish-desktop-release:
    needs: build-desktop-matrix
    if: ${{ always() && needs.build-desktop-matrix.result == 'success' }}
    name: Publish All 2 EXEs to latest-desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-desktop-*
          merge-multiple: true
          path: release_desktop
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view latest-desktop >/dev/null 2>&1 || gh release create latest-desktop --title "NutriFresh Desktop Windows (.exe Auto-Update)" --notes "Rilis otomatis NutriFresh_POS.exe & NutriFresh_Office.exe untuk In-App Auto-Updater Windows." || true
          for i in 1 2 3 4 5; do
            if gh release upload latest-desktop release_desktop/* --clobber; then
              echo "[release] All 2 EXEs & manifests uploaded cleanly to latest-desktop!"
              exit 0
            fi
            sleep $((i * 4))
          done
          exit 1
